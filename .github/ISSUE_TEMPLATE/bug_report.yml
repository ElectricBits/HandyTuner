name: Bug report
description: Something doesn't work, or HandyTuner did something it shouldn't.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If HandyTuner changed something it shouldn't have, **Diagnostics → Reset everything to stock** puts it back.
  - type: input
    id: device
    attributes:
      label: Device
      description: Maker and model, e.g. "AYN Odin 2 Portal". HandyTuner is only tested on the Odin 2 Portal so far.
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "13"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HandyTuner version
      description: Shown in the About card at the bottom of the Home page.
      placeholder: 0.10.1-beta
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      placeholder: |
        1. Open …
        2. Press …
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: In HandyTuner, **Diagnostics → Export log file**, then drag the file from your Downloads folder here. It only contains HandyTuner's own messages.
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
